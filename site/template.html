<!doctype html>
<html lang="{{lang}}" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{seoTitle}}</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="{{author}}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="{{canonicalUrl}}">
  <link rel="alternate" hreflang="ko" href="{{koUrl}}">
  <link rel="alternate" hreflang="en" href="{{enUrl}}">
  <link rel="alternate" hreflang="x-default" href="{{enUrl}}">
  <link rel="sitemap" type="application/xml" href="{{sitemapUrl}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{siteName}}">
  <meta property="og:title" content="{{seoTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonicalUrl}}">
  <meta property="og:locale" content="{{ogLocale}}">
  <meta property="og:locale:alternate" content="{{ogAlternateLocale}}">
  <meta property="og:image" content="{{imageUrl}}">
  <meta property="og:image:secure_url" content="{{imageUrl}}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{imageAlt}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{seoTitle}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{imageUrl}}">
  <meta name="twitter:image:alt" content="{{imageAlt}}">
  <script type="application/ld+json">{{structuredData}}</script>
  <link rel="icon" type="image/svg+xml" href="{{base}}assets/certificate.svg">
  <script>
    (() => {
      let mode;
      try { mode = localStorage.getItem('mtls-theme'); } catch {}
      document.documentElement.dataset.theme = mode === 'light' || mode === 'dark'
        ? mode : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="{{base}}styles.css">
  <script type="module" src="{{base}}app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">{{skip}}</a>
  <header class="topbar"><div class="topbar-inner">
    <a class="wordmark" href="{{homeHref}}"><img src="{{base}}assets/certificate.svg" alt="" width="30" height="30">mTLS Tutorial</a>
    <div class="top-actions">
      <div class="language-switch" role="group" aria-label="{{languageLabel}}">
        <a lang="ko" hreflang="ko" href="{{koHref}}"{{koCurrent}} aria-label="한국어">KO</a>
        <a lang="en" hreflang="en" href="{{enHref}}"{{enCurrent}} aria-label="English">EN</a>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="{{themeLabel}}" aria-pressed="false" title="{{themeLabel}}">
        <svg class="moon-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.8 13.5A9 9 0 0 1 10.5 3.2a9 9 0 1 0 10.3 10.3Z"/></svg>
        <svg class="sun-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="repo-link" aria-label="{{repositoryLabel}}" href="https://github.com/yoobato/mTLS-Tutorial">GitHub ↗</a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar">{{contents}}</button></div>
  </div></header>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="{{contentsLabel}}"><div class="sidebar-label">{{contents}}</div><nav>{{navigation}}</nav></aside>
    <main id="main">
      <div class="document-meta">mTLS Tutorial</div>
      <article>{{content}}</article>
      <nav class="pagination" aria-label="{{paginationLabel}}">{{pagination}}</nav>
      <footer><span>© 2021 Daeyeol Ryu. All rights reserved.</span><span class="footer-license">AGPL-3.0</span></footer>
    </main>
    <aside class="page-toc" aria-label="{{onThisPage}}"{{tocHidden}}><div class="sidebar-label">{{onThisPage}}</div><nav>{{toc}}</nav></aside>
  </div>
  <div id="copy-status" role="status" aria-live="polite"></div>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{title}} · mTLS Tutorial</title>
  <meta name="description" content="정보제공자를 위한 mTLS 튜토리얼. Nginx와 Apache의 클라이언트 인증서 검증을 실습합니다.">
  <link rel="icon" type="image/svg+xml" href="{{base}}assets/certificate.svg">
  <script>
    (() => {
      let mode;
      try { mode = localStorage.getItem('mtls-theme'); } catch {}
      document.documentElement.dataset.theme = mode === 'light' || mode === 'dark'
        ? mode : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="{{base}}styles.css">
  <script type="module" src="{{base}}app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="topbar"><div class="topbar-inner">
    <a class="wordmark" href="{{base}}"><img src="{{base}}assets/certificate.svg" alt="" width="30" height="30">mTLS Tutorial</a>
    <div class="top-actions">
      <div class="language-switch" role="group" aria-label="언어 선택">
        <button type="button" lang="ko" aria-pressed="true" aria-label="한국어">KO</button>
        <button type="button" lang="en" disabled title="English — 준비 중" aria-label="English — 준비 중">EN</button>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="다크 모드" aria-pressed="false" title="어두운 모드로 전환">
        <svg class="moon-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.8 13.5A9 9 0 0 1 10.5 3.2a9 9 0 1 0 10.3 10.3Z"/></svg>
        <svg class="sun-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="repo-link" aria-label="GitHub 저장소" href="https://github.com/yoobato/mTLS-Tutorial">GitHub ↗</a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar">목차</button></div>
  </div></header>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="문서 목차"><div class="sidebar-label">목차</div><nav>{{navigation}}</nav><div class="sidebar-note">한국어 초안<br><small>Nginx · Apache · cURL</small></div></aside>
    <main id="main">
      <div class="document-meta">Daeyeol Ryu / 한국어 가이드</div>
      <article>{{content}}</article>
      <nav class="pagination" aria-label="이전 및 다음 문서">{{pagination}}</nav>
      <footer><span>Daeyeol Ryu · AGPL-3.0</span></footer>
    </main>
    <aside class="page-toc" aria-label="이 페이지에서"><div class="sidebar-label">이 페이지에서</div><nav>{{toc}}</nav></aside>
  </div>
  <div id="copy-status" role="status" aria-live="polite"></div>
</body>
</html>
